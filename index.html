<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Admin Nvthuan</title>
    <!-- Nhúng thư viện Firebase từ Google -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; overflow-x: auto; display: block; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; white-space: nowrap; }
        th { background: #007bff; color: white; }
        h2, h3 { margin-top: 0; color: #333; }
    </style>
</head>
<body>

    <h2>Quản Lý Ứng Dụng Admin</h2>

    <!-- Phần Tạo Tài Khoản / Key -->
    <div class="card">
        <h3>Tạo Tài Khoản & Key Mới</h3>
        <input type="text" id="username" placeholder="Tên tài khoản (Usuário)">
        <input type="text" id="password" placeholder="Mật khẩu (Senha)">
        <input type="number" id="devices" placeholder="Số thiết bị tối đa">
        <input type="number" id="days" placeholder="Số ngày sử dụng">
        <button onclick="taoTaiKhoan()">Tạo Ngay Lập Tức</button>
    </div>

    <!-- Phần Hiển Thị Thông Tin Đăng Nhập Từ Thiết Bị -->
    <div class="card">
        <h3>Thông Tin Thiết Bị Đăng Nhập</h3>
        <table id="bangDulieu">
            <tr>
                <th>Tài Khoản</th>
                <th>Tên Điện Thoại</th>
                <th>Android</th>
                <th>Ngày Giờ</th>
                <th>Trạng Thái</th>
            </tr>
        </table>
    </div>

    <script>
        // Cấu hình Firebase chuẩn xác từ dự án của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyB2eMK7y1udMPK7iDi_5sbl3ZJIku5meeA",
            databaseURL: "https://admin-e5361-default-rtdb.firebaseio.com",
            projectId: "admin-e5361",
            storageBucket: "admin-e5361.firebasestorage.app"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Hàm đẩy tài khoản mới lên Firebase Realtime Database
        function taoTaiKhoan() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let d = document.getElementById('devices').value;
            let day = document.getElementById('days').value;

            if(!u || !p) {
                alert("Vui lòng điền đầy đủ tên tài khoản và mật khẩu!");
                return;
            }

            db.ref('Usuarios').push({
                Usuário: u,
                Senha: p,
                SoThietBi: d || "1",
                SoNgay: day || "30",
                Conectados: 0,
                Status: true
            }, function(error) {
                if (error) {
                    alert("Có lỗi xảy ra: " + error.message);
                } else {
                    alert("Đã tạo tài khoản thành công lên Firebase!");
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('devices').value = '';
                    document.getElementById('days').value = '';
                }
            });
        }

        // 2. Hàm lắng nghe dữ liệu từ Firebase để đổ ra bảng quản lý
        db.ref('Usuarios').on('value', function(snapshot) {
            let bang = document.getElementById('bangDulieu');
            // Giữ lại tiêu đề bảng, làm sạch các dòng cũ
            bang.innerHTML = `
                <tr>
                    <th>Tài Khoản</th>
                    <th>Tên Điện Thoại</th>
                    <th>Android</th>
                    <th>Ngày Giờ</th>
                    <th>Trạng Thái</th>
                </tr>
            `;

            snapshot.forEach(function(childSnapshot) {
                let data = childSnapshot.val();
                let row = `<tr>
                    <td>${data.Usuário || 'Chưa có'}</td>
                    <td>${data.DeviceName || 'Chưa kết nối'}</td>
                    <td>${data.AndroidVersion || 'N/A'}</td>
                    <td>${data.LoginTime || 'N/A'}</td>
                    <td>${data.Status ? 'Hoạt động' : 'Khóa'}</td>
                </tr>`;
                bang.innerHTML += row;
            });
        });
    </script>
</body>
</html>
